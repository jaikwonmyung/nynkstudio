<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Original AIVP</title>
  <style>
    :root {
      color-scheme: light;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ffffff;
    }

    #entry-gate {
      position: fixed;
      inset: 0;
      background: #ffffff;
    }

    #entry-hotspot {
      position: absolute;
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      width: 72px;
      height: 72px;
      margin: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      opacity: 0;
      cursor: default;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>

<body>
  <main id="entry-gate">
    <button id="entry-hotspot" type="button" aria-label="Enter Original AIVP"></button>
  </main>

  <script>
    (() => {
      const hotspot = document.getElementById('entry-hotspot');
      const enter = () => {
        const target = window.matchMedia('(max-width: 768px)').matches
          ? '/mobile.html'
          : '/app.html';
        window.location.assign(target);
      };

      hotspot.addEventListener('click', enter, { once: true });
    })();
  </script>
</body>

</html>
